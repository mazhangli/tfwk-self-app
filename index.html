<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="screen-orientation" content="portrait" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="full-screen" content="yes" />
    <meta name="x5-fullscreen" content="true" />
    <title></title>
    <!-- <link href="/public/css/style.css" rel="stylesheet" type="text/css" media="all" /> -->
  </head>
  <body ontouchmove="javascript:window.event.preventDefault();">
    <div id="app">
      <div class="app-loading">
        <div class="app-loading-wrap">
          <img src="/resource/logo.svg" class="app-loading-logo" />
          <div class="app-loading-dots">
            <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="app-loading-title">医疗自助服务系统</div>
        </div>
      </div>
      <!-- <router-view></router-view> -->
    </div>
    <script type="module" src="/src/main.ts">
      // // 获取根元素
      // const rootElement = document.documentElement || document.body;
      
      // if ('ontouchstart' in window) { // 判断设备是否支持Touch功能
      //     // 移除默认的触摸事件处理程序
      //     rootElement.addEventListener('touchmove', function(event) {
      //         event.preventDefault();
      //     }, false);
      // } else {
      //     // 非Touch设备则直接返回
      //     return;
      // }
    </script>
  </body>
  
  <style>
    html {
      touch-action: none;
    }
    body {
      margin: 0px;
      font-size: 0.35rem;
    }
    #app {
      width: 100vw;
      height: 100vh;
    }
    .app-loading {
      display: flex;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: #f0f2f5;
      background: url('/resource/ground.gif') no-repeat;
      background-size: 100% 100%;
    }

    .app-loading .app-loading-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      display: flex;
      -webkit-transform: translate3d(-50%, -50%, 0);
      transform: translate3d(-50%, -50%, 0);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .app-loading .dots {
      display: flex;
      padding: 98px;
      justify-content: center;
      align-items: center;
    }

    .app-loading .app-loading-title {
      display: flex;
      margin-top: 30px;
      font-size: 30px;
      color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    .app-loading .app-loading-logo {
      display: block;
      width: 210px;
      margin: 0 auto;
      margin-bottom: 20px;
    }

    .dot {
      position: relative;
      display: inline-block;
      width: 96px;
      height: 96px;
      margin-top: 30px;
      font-size: 64px;
      transform: rotate(45deg);
      box-sizing: border-box;
      animation: antRotate 1.2s infinite linear;
    }

    .dot i {
      position: absolute;
      display: block;
      width: 40px;
      height: 40px;
      background-color: #0065cc;
      border-radius: 100%;
      opacity: 0.3;
      transform: scale(0.75);
      animation: antSpinMove 1s infinite linear alternate;
      transform-origin: 50% 50%;
    }

    .dot i:nth-child(1) {
      top: 0;
      left: 0;
    }

    .dot i:nth-child(2) {
      top: 0;
      right: 0;
      -webkit-animation-delay: 0.4s;
      animation-delay: 0.4s;
    }

    .dot i:nth-child(3) {
      right: 0;
      bottom: 0;
      -webkit-animation-delay: 0.8s;
      animation-delay: 0.8s;
    }

    .dot i:nth-child(4) {
      bottom: 0;
      left: 0;
      -webkit-animation-delay: 1.2s;
      animation-delay: 1.2s;
    }
    @keyframes antRotate {
      to {
        -webkit-transform: rotate(405deg);
        transform: rotate(405deg);
      }
    }
    @-webkit-keyframes antRotate {
      to {
        -webkit-transform: rotate(405deg);
        transform: rotate(405deg);
      }
    }
    @keyframes antSpinMove {
      to {
        opacity: 1;
      }
    }
    @-webkit-keyframes antSpinMove {
      to {
        opacity: 1;
      }
    }
  </style>
</html>
